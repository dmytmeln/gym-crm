datasource.jdbc-url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
datasource.username=sa
datasource.password=

datasource.hikari.maxPoolSize=5
datasource.hikari.minIdle=2
datasource.hikari.connectionTimeout=30000
datasource.hikari.idleTimeout=600000
datasource.hikari.maxLifetime=1800000

hibernate.hbm2ddl-auto=none
hibernate.show-sql=false
hibernate.format-sql=false