spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.gym.crm: DEBUG
