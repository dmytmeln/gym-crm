spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gym_db
    username: gym
    password: gym
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  liquibase:
    change-log: classpath:db/changelog/changelog-root.xml

server:
  servlet:
    context-path: /gym-crm
  port: 8080

app:
  api:
    base-path: /api/v1

hibernate:
  hbm2ddl-auto: validate
  show-sql: false
  format-sql: false
