app:
  api:
    base-path: /api/v1

datasource:
  jdbc-url: ${DB_URL:jdbc:mysql://localhost:3306/gym_db}
  username: ${DB_USERNAME:gym}
  password: ${DB_PASSWORD:gym}
  driver-class-name: com.mysql.cj.jdbc.Driver

  hikari:
    max-pool-size: 10
    min-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

hibernate:
  hbm2ddl-auto: validate
  show-sql: false
  format-sql: false

liquibase:
  change-log: classpath:db/changelog/changelog-root.xml