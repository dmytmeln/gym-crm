spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}

logging:
  level:
    root: WARN
    org.springframework: WARN
    com.gym.crm: INFO
